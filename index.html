<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0C1012">
<title>For you</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/Fraunces-normal-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/Fraunces-italic-latin.woff2">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;color:#F3EFE2;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 80% at 50% 115%,#3B2A24 0%,#1A2219 40%,#0C1012 100%) fixed #0C1012;overflow:hidden}
  .stars,.stars::after{position:fixed;top:0;left:0;width:2px;height:2px;border-radius:50%;background:transparent;pointer-events:none;
    animation:tw 5s ease-in-out infinite alternate}
  .stars::after{content:"";animation-delay:-2.5s}
  @keyframes tw{from{opacity:.45}to{opacity:1}}
  .moon{position:fixed;top:9vh;right:12vw;width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 40% 38%,#FFF8E6,#F2E6C8 60%,#E2D2AE);
    box-shadow:0 0 30px 8px rgba(255,226,180,.28),0 0 90px 30px rgba(255,226,180,.12)}
  main{position:relative;max-width:440px;width:100%;text-align:center}
  .k{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#E2C27A;margin:0 0 16px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:clamp(2.3rem,10vw,3.4rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 14px}
  h1 em{font-style:italic;color:#F1A3AE;font-variation-settings:"SOFT" 100,"WONK" 1}
  .hint{color:#C9C6B3;font-size:.95rem;margin:0 0 30px}
  form{display:flex;flex-direction:column;align-items:center;gap:16px}
  input{width:100%;max-width:300px;background:transparent;border:0;border-bottom:1.5px solid rgba(243,239,226,.35);color:#F3EFE2;
    font-family:"Fraunces",Georgia,serif;font-size:1.6rem;text-align:center;padding:8px 4px;outline:none;border-radius:0;transition:border-color .3s}
  input:focus{border-color:#F1A3AE}
  input::placeholder{color:rgba(243,239,226,.35);font-style:italic;font-size:1.1rem}
  button{border:0;border-radius:99px;padding:13px 30px;background:#F1A3AE;color:#2A1216;font:600 1rem "Plus Jakarta Sans",sans-serif;cursor:pointer;
    transition:transform .2s,opacity .3s}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.6}
  .msg{min-height:1.6em;margin:18px 0 0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.08rem;color:#F1A3AE}
  .shake{animation:sh .45s}
  @keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .opening main{opacity:0;visibility:hidden}
  .wait{position:fixed;inset:0;display:grid;place-items:center;font-family:"Fraunces",Georgia,serif;font-style:italic;color:#C9C6B3;
    opacity:0;pointer-events:none;transition:opacity .6s}
  .opening .wait{opacity:1}
  .auto main{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="auto">
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<main>
  <p class="k">Before you come in</p>
  <h1>What did I <em>name</em> you?</h1>
  <p class="hint">Not one of the cute ones — the name I actually set.</p>
  <form id="f" autocomplete="off">
    <input id="a" type="text" placeholder="one word" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Your answer" maxlength="40">
    <button id="b" type="submit">Come in</button>
  </form>
  <p class="msg" id="m" aria-live="polite"></p>
</main>
<div class="wait" aria-live="polite">opening…</div>
<script>
(function(){
"use strict";
var SALT="DejHGgtYqCLAsDTjRTu9QA==", ITER=250000, VAULT="assets/vault.7f28f9f813.bin", KEYNAME="tofu.k";
var $=function(id){ return document.getElementById(id); };
// a sky of tiny stars, drawn with one element
(function(){
  var s=[], n=Math.round(innerWidth*innerHeight/5200);
  for (var i=0;i<n;i++){ var a=(Math.random()*.6+.25).toFixed(2);
    s.push(Math.round(Math.random()*innerWidth)+"px "+Math.round(Math.random()*innerHeight)+"px 0 "+(Math.random()<.12?"1px":"0")+" rgba(255,248,230,"+a+")"); }
  $("stars").style.boxShadow=s.join(",");
})();
if (!window.crypto || !crypto.subtle){ document.body.className=""; $("m").textContent="This needs a newer browser. Open it in Safari or Chrome."; return; }

function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function u8b64(u){ var s=""; for (var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
function norm(s){ return String(s||"").toLowerCase().replace(/\s+/g,""); }
// fetched once and shared; a failed fetch is dropped so the next try asks again, and that try goes past the cache,
// which may be holding the failure (a lost signal or a 404 must not stick)
var vaultP=null, tries=0;
function vault(){
  return vaultP || (vaultP=fetch(VAULT,{cache:tries++ ? "reload" : "force-cache"}).then(function(r){ if (!r.ok) throw new Error("vault "+r.status); return r.arrayBuffer(); })
    .catch(function(e){ vaultP=null; throw e; }));
}
vault().catch(function(){});
var OFFLINE="Couldn't open it just now — check the internet and try again.", CHANGED="It just changed — give it a minute, then reload.";
// a network failure or a missing vault, as opposed to a key that doesn't fit
function netFail(err){ return !!err && (err.name==="TypeError" || /^vault \d/.test(err.message||"")); }
function gone(err){ return !!err && /^vault 404/.test(err.message||""); }
// the vault this page asks for is gone: a deploy replaced the site while this copy sat in a cache. Fetch the new page, once
function reloadOnce(){
  try{ if (Date.now()-(+sessionStorage.getItem("tofu.reload")||0) < 60000) return false;
       sessionStorage.setItem("tofu.reload",String(Date.now())); sessionStorage.setItem("tofu.upd","1"); }catch(e){ return false; }
  location.reload(); return true;
}

function derive(pass){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  });
}
function unseal(key){
  return vault().then(function(buf){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(buf,0,12)},key,new Uint8Array(buf,12));
  });
}
function esc(p){ return p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function build(ab){
  var dv=new DataView(ab), hl=dv.getUint32(0), dec=new TextDecoder();
  var files=JSON.parse(dec.decode(new Uint8Array(ab,4,hl))).files, base=4+hl, text={}, url={};
  files.forEach(function(f){
    var bytes=new Uint8Array(ab,base+f.o,f.n);
    if (/^text\//.test(f.t)) text[f.p]=dec.decode(bytes);
    else url[f.p]=URL.createObjectURL(new Blob([bytes],{type:f.t}));
  });
  // media first, so the scripts and the page point at the unsealed copies
  Object.keys(url).forEach(function(p){
    var rx=new RegExp(esc(p),"g");
    Object.keys(text).forEach(function(t){ text[t]=text[t].replace(rx,url[p]); });
  });
  var html=text["index.html"];
  // every sealed script and stylesheet becomes a blob the page loads in its usual place
  Object.keys(text).forEach(function(p){
    var m=/\.(js|css)$/.exec(p); if (!m) return;
    var u=URL.createObjectURL(new Blob([text[p]],{type:m[1]==="js"?"text/javascript":"text/css"}));
    html=html.split((m[1]==="js"?'src="':'href="')+p+'"').join((m[1]==="js"?'src="':'href="')+u+'"');
  });
  return html;
}
var opened=false;
function enter(html){
  // the page is written once: a second write (her remembered key and a typed answer both landing) would wipe the
  // first copy and leave its 3D loop running unseen
  if (opened) return; opened=true;
  // never swap documents mid-load: a returning visit unlocks from cache so fast that
  // document.open() would otherwise abort this page's own load
  var go=function(){ document.open(); document.write(html); document.close(); };
  if (document.readyState==="complete") go(); else window.addEventListener("load",go,{once:true});
}
function tryKey(key, remember){
  return unseal(key).then(function(ab){
    if (opened) return true;
    var html=build(ab);
    if (remember) crypto.subtle.exportKey("raw",key).then(function(raw){ try{ localStorage.setItem(KEYNAME,u8b64(new Uint8Array(raw))); }catch(e){} }).then(function(){ enter(html); });
    else enter(html);
    return true;
  });
}
// she has been here before: no question
var saved=null; try{ saved=localStorage.getItem(KEYNAME); }catch(e){}
if (saved){
  document.body.className="opening";
  // decoded inside the chain, so a damaged key lands in the catch (and is forgotten) instead of stopping this script
  Promise.resolve().then(function(){ return crypto.subtle.importKey("raw",b64(saved),{name:"AES-GCM"},true,["decrypt"]); })
    .then(function(k){ return tryKey(k,false); })
    .catch(function(err){
      if (gone(err) && reloadOnce()) return;
      // only a key that no longer fits is forgotten; a dropped connection or a missing vault keeps it for next time
      if (netFail(err)) $("m").textContent=gone(err) ? CHANGED : OFFLINE; else { try{ localStorage.removeItem(KEYNAME); }catch(e){} }
      document.body.className=""; $("a").focus();
    });
  // a slow download is still coming: say so, and keep waiting. The form only comes back on a real failure, since typing
  // would wait on the same download
  setTimeout(function(){ var w=document.querySelector(".wait"); if (w && document.body.className==="opening") w.textContent="still opening… slow internet, maybe"; },12000);
} else {
  document.body.className="";
  try{ if (sessionStorage.getItem("tofu.upd")){ sessionStorage.removeItem("tofu.upd"); $("m").textContent="It just updated — type it once more."; } }catch(e){}
}

var wrong=0, LINES=["Hmm, not that one. Try again 🌷","Hint: it's something sweet.","My favourite sweet, actually. You know this one."];
$("f").addEventListener("submit",function(e){
  e.preventDefault();
  if (opened || document.body.className==="opening") return;
  var v=norm($("a").value), btn=$("b"), m=$("m");
  if (!v){ m.textContent="Type it in, one word."; return; }
  btn.disabled=true; m.textContent="";
  derive(v).then(function(k){ return tryKey(k,true); }).catch(function(err){
    btn.disabled=false;
    if (err && err.name==="OperationError"){
      m.textContent=LINES[Math.min(wrong,LINES.length-1)]; wrong++;
      var f=$("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      $("a").select();
    } else {
      if (gone(err) && reloadOnce()) return;
      m.textContent=gone(err) ? CHANGED : OFFLINE;
    }
  });
});
})();
</script>
</body>
</html>
